name: Deploy
run-name: Deploy ${{ inputs.worker }}

on:
  workflow_dispatch:
    inputs:
      worker:
        description: Worker directory name under workers/, or all
        required: true
        default: all
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  validate:
    name: Lint, typecheck, test, and dry-run deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run types -- --all --check
      - run: npm run typecheck
      - run: npm test
      - run: npm run dry-run -- --all

  deploy:
    name: Deploy Cloudflare Worker
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate selected Worker
        if: inputs.worker != 'all'
        env:
          SELECTED_WORKER: ${{ inputs.worker }}
        run: npm run dry-run -- "$SELECTED_WORKER"

      - name: Deploy cookie-web-ai and synchronize its secrets
        if: inputs.worker == 'all' || inputs.worker == 'cookie-web-ai'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/cookie-web-ai
          command: deploy
          secrets: |
            OPENAI_API_KEY
            SENTRY_DSN
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Deploy cookie-web-calendar and synchronize its secrets
        if: inputs.worker == 'all' || inputs.worker == 'cookie-web-calendar'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/cookie-web-calendar
          command: deploy
          secrets: |
            OPENAI_API_KEY
            SENTRY_DSN
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Deploy cookie-web-emails and synchronize its secrets
        if: inputs.worker == 'all' || inputs.worker == 'cookie-web-emails'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/cookie-web-emails
          command: deploy
          secrets: |
            SENTRY_DSN
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Deploy cookie-web-labels and synchronize its secrets
        if: inputs.worker == 'all' || inputs.worker == 'cookie-web-labels'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/cookie-web-labels
          command: deploy
          secrets: |
            SENTRY_DSN
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Deploy cookie-web-messages and synchronize its secrets
        if: inputs.worker == 'all' || inputs.worker == 'cookie-web-messages'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/cookie-web-messages
          command: deploy
          # RESEND_API_KEY is not synced here: unsubscribe already falls back
          # gracefully without it (a manual link/mailto: URI instead of a
          # sent email), and wrangler-action fails the whole deploy if a
          # *listed* secret has no value. Set it once with `wrangler secret
          # put` if/when mailto unsubscribe sends should go live; Cloudflare
          # keeps it across later deploys either way.
          secrets: |
            SENTRY_DSN
            BLOB_READ_WRITE_TOKEN
            MEILISEARCH_API_KEY
            OPENAI_API_KEY
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          MEILISEARCH_API_KEY: ${{ secrets.MEILISEARCH_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Deploy cookie-web-notifications and synchronize its secrets
        if: inputs.worker == 'all' || inputs.worker == 'cookie-web-notifications'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/cookie-web-notifications
          command: deploy
          secrets: |
            SENTRY_DSN
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Deploy cookie-web-receipts and synchronize its secrets
        if: inputs.worker == 'all' || inputs.worker == 'cookie-web-receipts'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/cookie-web-receipts
          command: deploy
          secrets: |
            SENTRY_DSN
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Deploy cookie-web-search and synchronize its secrets
        if: inputs.worker == 'all' || inputs.worker == 'cookie-web-search'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/cookie-web-search
          command: deploy
          secrets: |
            OPENAI_API_KEY
            SENTRY_DSN
            MEILISEARCH_API_KEY
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          MEILISEARCH_API_KEY: ${{ secrets.MEILISEARCH_API_KEY }}

      - name: Deploy cookie-web-send and synchronize its secrets
        if: inputs.worker == 'all' || inputs.worker == 'cookie-web-send'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/cookie-web-send
          command: deploy
          # RESEND_API_KEY and EMAIL_FROM are not synced here: no matching
          # GitHub secrets exist (Vercel marked both sensitive, so they cannot
          # be exported), and wrangler-action fails the whole deploy if a
          # *listed* secret has no value. Both were set once with `wrangler
          # secret put` and Cloudflare keeps them across later deploys.
          # SCHEDULED_SEND_FLUSH_TOKEN reuses the
          # COOKIE_WEB_FLUSH_TOKEN secret the flusher already holds — the two
          # ends of the flush handshake stay on one value.
          secrets: |
            SCHEDULED_SEND_FLUSH_TOKEN
            SENTRY_DSN
            MEILISEARCH_API_KEY
        env:
          SCHEDULED_SEND_FLUSH_TOKEN: ${{ secrets.COOKIE_WEB_FLUSH_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          MEILISEARCH_API_KEY: ${{ secrets.MEILISEARCH_API_KEY }}

      - name: Deploy cookie-web-tasks and synchronize its secrets
        if: inputs.worker == 'all' || inputs.worker == 'cookie-web-tasks'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/cookie-web-tasks
          command: deploy
          # ENRICHER_TRIGGER_TOKEN reuses data-enricher's own HTTP_TRIGGER_TOKEN
          # secret value: POST /tasks/refresh calls data-enricher's POST /run
          # over the ENRICHER service binding (wrangler.jsonc), but /run also
          # answers on data-enricher's public workers.dev URL, so the token
          # stays required end to end.
          secrets: |
            ENRICHER_TRIGGER_TOKEN
            BLOB_READ_WRITE_TOKEN
            SENTRY_DSN
            MEILISEARCH_API_KEY
        env:
          ENRICHER_TRIGGER_TOKEN: ${{ secrets.HTTP_TRIGGER_TOKEN }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          MEILISEARCH_API_KEY: ${{ secrets.MEILISEARCH_API_KEY }}

      - name: Deploy mail-app-ingest and synchronize its secrets
        if: inputs.worker == 'all' || inputs.worker == 'mail-app-ingest'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/mail-app-ingest
          command: deploy
          secrets: |
            OPENAI_API_KEY
            SENTRY_DSN
            BLOB_READ_WRITE_TOKEN
            MEILISEARCH_API_KEY
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          MEILISEARCH_API_KEY: ${{ secrets.MEILISEARCH_API_KEY }}

      - name: Deploy data-enricher and synchronize its secrets
        if: inputs.worker == 'all' || inputs.worker == 'data-enricher'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/data-enricher
          command: deploy
          # Only required secrets are synced here: wrangler-action fails the
          # whole deploy if any listed secret has no value. The news round-up's
          # optional PRODUCT_HUNT_TOKEN and GITHUB_API_TOKEN are set once with
          # `wrangler secret put` and survive later deploys untouched.
          secrets: |
            OPENAI_API_KEY
            HTTP_TRIGGER_TOKEN
            SENTRY_DSN
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HTTP_TRIGGER_TOKEN: ${{ secrets.HTTP_TRIGGER_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Deploy scheduled-send-flusher and synchronize its secrets
        if: inputs.worker == 'all' || inputs.worker == 'scheduled-send-flusher'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/scheduled-send-flusher
          command: deploy
          secrets: |
            COOKIE_WEB_FLUSH_TOKEN
            HTTP_TRIGGER_TOKEN
            SENTRY_DSN
        env:
          COOKIE_WEB_FLUSH_TOKEN: ${{ secrets.COOKIE_WEB_FLUSH_TOKEN }}
          HTTP_TRIGGER_TOKEN: ${{ secrets.HTTP_TRIGGER_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Deploy selected Worker
        if: >-
          inputs.worker != 'all' &&
          inputs.worker != 'cookie-web-ai' &&
          inputs.worker != 'cookie-web-calendar' &&
          inputs.worker != 'cookie-web-emails' &&
          inputs.worker != 'cookie-web-labels' &&
          inputs.worker != 'cookie-web-messages' &&
          inputs.worker != 'cookie-web-notifications' &&
          inputs.worker != 'cookie-web-receipts' &&
          inputs.worker != 'cookie-web-search' &&
          inputs.worker != 'cookie-web-send' &&
          inputs.worker != 'cookie-web-tasks' &&
          inputs.worker != 'mail-app-ingest' &&
          inputs.worker != 'data-enricher' &&
          inputs.worker != 'scheduled-send-flusher'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/${{ inputs.worker }}
          command: deploy
