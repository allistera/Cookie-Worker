name: Search Reindex

# Manual only, and deliberately so. This configures each index's embedder and
# pushes every row through it, which means Meilisearch calls OpenAI to embed the
# entire corpus — slow, and it costs real money. It is needed once at cutover,
# and again after any change to a descriptor's settings or documentTemplate,
# because nothing else in the system calls configureIndex.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Which index to reindex
        required: true
        default: documents
        type: choice
        options:
          - documents
          - messages
          - task_items
          - all
      confirm:
        description: Type "reindex" to confirm — this re-embeds the whole corpus at cost
        required: true
        type: string

concurrency:
  group: search-reindex
  cancel-in-progress: false

jobs:
  reindex:
    name: Reindex ${{ inputs.target }}
    runs-on: ubuntu-latest

    steps:
      # Guard first, before checkout: a mistyped confirmation should cost
      # nothing and take no runner time.
      - name: Check confirmation
        if: inputs.confirm != 'reindex'
        run: |
          echo "::error::Confirmation not given. Re-run and type 'reindex' in the confirm field."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reindex
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MEILISEARCH_URL: https://ms-52028f71df74-53700.lon.meilisearch.io
          MEILISEARCH_API_KEY: ${{ secrets.MEILISEARCH_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ "${{ inputs.target }}" = "all" ]; then
            node scripts/reindex-meili.js documents
            node scripts/reindex-meili.js messages
            node scripts/reindex-meili.js task_items
          else
            node scripts/reindex-meili.js "${{ inputs.target }}"
          fi
