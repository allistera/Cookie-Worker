name: Search Drift Repair

on:
  workflow_dispatch:
  schedule:
    # Weekly self-heal: re-pushes rows a save-time sync failure left behind.
    - cron: '0 6 * * 1'

concurrency:
  group: search-drift-repair
  cancel-in-progress: false

jobs:
  repair:
    name: Repair Meilisearch index drift
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repair search index drift
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Not a secret: the same endpoint is committed in three wrangler.jsonc
          # files. Keeping it inline means one less secret to provision, and one
          # less way for this job to fail silently on a missing value.
          MEILISEARCH_URL: https://ms-52028f71df74-53700.lon.meilisearch.io
          MEILISEARCH_API_KEY: ${{ secrets.MEILISEARCH_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/repair-search-drift.js
