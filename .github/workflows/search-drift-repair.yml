name: Search Drift Repair

on:
  workflow_dispatch:
  schedule:
    # Weekly self-heal: re-pushes rows a save-time sync failure left behind.
    - cron: '0 6 * * 1'

concurrency:
  group: search-drift-repair
  cancel-in-progress: false

jobs:
  repair:
    name: Repair Meilisearch index drift
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repair search index drift
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MEILISEARCH_URL: ${{ secrets.MEILISEARCH_URL }}
          MEILISEARCH_API_KEY: ${{ secrets.MEILISEARCH_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/repair-search-drift.js
