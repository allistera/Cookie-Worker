[project]
name = "data-enricher"
version = "0.1.0"
description = "Scheduled data enrichment Worker"
requires-python = ">=3.13"
dependencies = [
    # 2.9.2 is the newest fastmcp whose dependency set resolves for the
    # Workers (emscripten/Pyodide) target; 3.x requires uvicorn unconditionally.
    "fastmcp==3.2.0",
    # fastmcp imports uvicorn at module load even though a cron Worker never
    # serves HTTP; the mcp SDK excludes it on emscripten, so vendor it directly.
    "uvicorn",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
]
